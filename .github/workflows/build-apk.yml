name: build-apk

# 云端构建安卓 APK（公开仓库，Actions 免费）
# 产物：**固定签名的 release APK**（可覆盖升级），发到 Release 供手机直接下载。
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write               # 建 Release 用
    env:
      GRADLE_VER: '8.7'
      ZS_VERSION_CODE: ${{ github.run_number }}   # versionCode 单调递增，手机才能覆盖升级
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠ 不用 runner 预装的 Gradle（当前 9.x）：AGP 8.1.4 依赖的 DependencyHandler.module()
      #   在 Gradle 9 已移除，且 Gradle 9 在**配置阶段**加载 AGP 就崩，连 `gradle wrapper` 都跑不到。
      - name: 安装 Gradle ${{ env.GRADLE_VER }}
        run: |
          set -euo pipefail
          cd "$HOME"
          curl -fsSL -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
          unzip -q gradle.zip
          echo "$HOME/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-${GRADLE_VER}/bin/gradle" --version | head -6

      # 固定签名钥匙（base64 存 Secrets；公开仓库的 Secrets 同样是加密的）
      - name: 还原签名钥匙
        env:
          KEYSTORE_B64: ${{ secrets.ZS_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::缺少 secret ZS_KEYSTORE_B64 —— 请按 mobile-app 文档配置签名钥匙"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ziisan-release.jks"
          echo "ZS_KEYSTORE=$RUNNER_TEMP/ziisan-release.jks" >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/ziisan-release.jks"

      - name: 构建 release APK（固定签名）
        working-directory: android
        env:
          ZS_KEYSTORE_PASSWORD: ${{ secrets.ZS_KEYSTORE_PASSWORD }}
          ZS_KEY_ALIAS: ${{ secrets.ZS_KEY_ALIAS }}
          ZS_KEY_PASSWORD: ${{ secrets.ZS_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 收集并校验 APK
        run: |
          set -euo pipefail
          ls -lh android/app/build/outputs/apk/release/
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/ziisan-android.apk
          python3 - <<'PY'
          import zipfile, os
          p = "out/ziisan-android.apk"
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              dex = [n for n in names if n.startswith("classes") and n.endswith(".dex")]
              joined = b"".join(z.read(n) for n in dex)
              print(f"APK {os.path.getsize(p)} 字节｜{len(names)} 条目")
              print("含 MainActivity：", b"MainActivity" in joined)
              print("含 Pages 地址：", b"mist1494732214.github.io" in joined)
              assert b"MainActivity" in joined, "APK 里没有 MainActivity"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ziisan-android-apk
          path: out/ziisan-android.apk

      - name: 发布到 Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 籽三 APK #${{ github.run_number }}
          body: |
            安卓安装包（固定签名，可**覆盖升级**，不用卸载）。

            安装：手机浏览器打开本页 → 下载 `ziisan-android.apk` → 允许「安装未知来源应用」→ 安装。
            首次打开：填 GitHub 用户名 / 仓库名 / 只读令牌（详见仓库 README）。

            versionCode：${{ github.run_number }}
          files: out/ziisan-android.apk
