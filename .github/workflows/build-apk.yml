name: build-apk

# 云端构建安卓 APK（公开仓库，Actions 免费）
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write               # 建 Release 用
    env:
      GRADLE_VER: '8.7'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠ 不用 runner 预装的 Gradle（当前是 9.x），也不用 wrapper 生成：
      #   AGP 8.1.4 依赖的 DependencyHandler.module() 在 Gradle 9 已移除，
      #   而 Gradle 9 在**配置阶段**加载 AGP 就抛 NoSuchMethodError，连 `gradle wrapper` 都跑不了。
      #   所以直接下载一个 Gradle 8.7 用（2026-10-18 实测）。
      - name: 安装 Gradle ${{ env.GRADLE_VER }}
        run: |
          set -euo pipefail
          cd "$HOME"
          curl -fsSL -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
          unzip -q gradle.zip
          echo "$HOME/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-${GRADLE_VER}/bin/gradle" --version | head -6

      - name: 环境自检
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | head || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null | head || true

      - name: 构建 debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 收集 APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk "out/ziisan-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ziisan-android-apk
          path: out/ziisan-android.apk

      # 手动触发时发 Release：手机上点链接就能下（不用登录 GitHub）
      - name: 发布到 Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 籽三 APK #${{ github.run_number }}
          body: |
            安卓安装包（WebView 壳，加载 https://mist1494732214.github.io/ziisan-app/）。

            **安装**：手机浏览器打开本页 → 下载 `ziisan-android.apk` → 允许「安装未知来源应用」→ 安装。
            **首次打开**：填 GitHub 用户名 / 仓库名 / 只读令牌（详见仓库 README）。
          files: out/ziisan-android.apk
