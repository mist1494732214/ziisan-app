name: build-apk

# 云端构建安卓 APK（公开仓库，Actions 免费）
# · 普通构建：只有壳，登录靠扫码/手填
# · 内置登录：若仓库配了临时 Secret ZS_LOGIN_PAYLOAD（用完就删），
#   会把登录载荷编进 BuildConfig.BAKED_URL —— 那种包**只能私下交付，不能发 Release**。
on:
  workflow_dispatch:
    inputs:
      bake_login:
        description: '把 ZS_LOGIN_PAYLOAD 编进 APK（私用包，不发 Release）'
        type: boolean
        default: false
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_VER: '8.7'
      ZS_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠ 不用 runner 预装的 Gradle 9.x：与 AGP 8.1.4 不兼容，且配置阶段就崩，
      #   连 `gradle wrapper` 都跑不到（2026-10-18 实测）。
      - name: 安装 Gradle ${{ env.GRADLE_VER }}
        run: |
          set -euo pipefail
          cd "$HOME"
          curl -fsSL -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
          unzip -q gradle.zip
          echo "$HOME/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"

      - name: 还原签名钥匙
        env:
          KEYSTORE_B64: ${{ secrets.ZS_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::缺少 secret ZS_KEYSTORE_B64"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ziisan-release.jks"
          echo "ZS_KEYSTORE=$RUNNER_TEMP/ziisan-release.jks" >> "$GITHUB_ENV"

      # 内置登录：只有手动触发且勾了 bake_login 时才注入（绝不打印内容）
      - name: 注入内置登录载荷（可选）
        if: github.event_name == 'workflow_dispatch' && inputs.bake_login
        env:
          PAYLOAD: ${{ secrets.ZS_LOGIN_PAYLOAD }}
        run: |
          set -euo pipefail
          if [ -z "${PAYLOAD:-}" ]; then
            echo "::error::勾了 bake_login 但没有 ZS_LOGIN_PAYLOAD secret"
            exit 1
          fi
          echo "::add-mask::$PAYLOAD"
          printf 'ZS_BAKED_URL=%s\n' "$PAYLOAD" >> "$GITHUB_ENV"
          echo "已注入内置登录载荷（长度 ${#PAYLOAD}）"

      - name: 构建 release APK（固定签名）
        working-directory: android
        env:
          ZS_KEYSTORE_PASSWORD: ${{ secrets.ZS_KEYSTORE_PASSWORD }}
          ZS_KEY_ALIAS: ${{ secrets.ZS_KEY_ALIAS }}
          ZS_KEY_PASSWORD: ${{ secrets.ZS_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 收集并校验 APK
        run: |
          set -euo pipefail
          ls -lh android/app/build/outputs/apk/release/
          if ls android/app/build/outputs/apk/release/ | grep -qi unsigned; then
            echo "::error::产出是 unsigned 包"
            exit 1
          fi
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/ziisan-android.apk
          python3 - <<'PY'
          import zipfile, os
          p = "out/ziisan-android.apk"
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              dex = b"".join(z.read(n) for n in names if n.startswith("classes") and n.endswith(".dex"))
              man = z.read("AndroidManifest.xml")
          print(f"APK {os.path.getsize(p)} bytes | {len(names)} entries")
          print("MainActivity in dex:", b"MainActivity" in dex)
          print("CAMERA in manifest:", "android.permission.CAMERA".encode("utf-16-le") in man)
          assert b"MainActivity" in dex
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ziisan-android-apk
          path: out/ziisan-android.apk

      # 只有"没内置登录"的包才允许发 Release（内置包含凭据，必须私下交付）
      - name: 发布到 Release（仅普通包）
        if: github.event_name == 'workflow_dispatch' && !inputs.bake_login
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 籽三 APK #${{ github.run_number }}
          body: |
            安卓安装包（固定签名，可覆盖升级）。首次打开用「📷 扫码登录」。
          files: out/ziisan-android.apk
