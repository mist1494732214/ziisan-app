name: build-apk

# 云端构建安卓 APK（公开仓库，Actions 免费）
# 触发：① 手动（workflow_dispatch）② 改动 android/ 或本文件时自动
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write               # 建 Release 用
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 环境自检
        run: |
          java -version
          gradle --version | head -6
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" | head

      # ⚠ 必须钉 Gradle 版本：ubuntu-latest 预装的是 Gradle 9.x，
      #   而 AGP 8.1.4 依赖的 DependencyHandler.module() 在 Gradle 9 已被移除，
      #   直接用系统 gradle 会报 NoSuchMethodError（2026-10-18 实测踩到）。
      #   用 wrapper 钉 8.7 即可复现本地/CI 一致的环境。
      - name: 生成 Gradle wrapper（钉 8.7）
        working-directory: android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin --no-daemon

      - name: 构建 debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 收集 APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk "out/ziisan-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ziisan-android-apk
          path: out/ziisan-android.apk

      # 手动触发时发 Release：手机上点链接就能下（不用登录 GitHub）
      - name: 发布到 Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 籽三 APK #${{ github.run_number }}
          body: |
            安卓安装包（WebView 壳，加载 https://mist1494732214.github.io/ziisan-app/）。

            **安装**：手机浏览器打开本页 → 下载 `ziisan-android.apk` → 允许「安装未知来源应用」→ 安装。
            **首次打开**：填 GitHub 用户名 / 仓库名 / 只读令牌（详见仓库 README）。
          files: out/ziisan-android.apk
