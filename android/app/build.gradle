plugins {
    id 'com.android.application'
}

// versionCode 用 CI 的 run_number（单调递增，手机上才能覆盖升级）；本地构建回退到 1。
def vCode = (System.getenv("ZS_VERSION_CODE") ?: "1").toInteger()

// 内置登录地址：只由 CI 用**临时 Secret** 注入（公开仓库里不留任何凭据）。
// 为空时 App 走普通首页，登录卡照旧（扫码/手填都可）。
def baked = System.getenv("ZS_BAKED_URL") ?: ""
def bakedEsc = baked.replace("\\", "\\\\").replace("\"", "\\\"")

android {
    namespace 'io.github.mist1494732214.ziisan'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.mist1494732214.ziisan"
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName "1.0.2"
        buildConfigField "String", "BAKED_URL", "\"" + bakedEsc + "\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ★ 固定签名：debug 包每次构建签名都不同 → 发新版会"签名冲突装不上"，只能卸载。
    //   这里用一把固定钥匙签 release 包，钥匙以 base64 存在仓库 Secrets（不进仓库）。
    signingConfigs {
        release {
            def ks = System.getenv("ZS_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ZS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ZS_KEY_ALIAS") ?: "ziisan"
                keyPassword System.getenv("ZS_KEY_PASSWORD") ?: System.getenv("ZS_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("ZS_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // 本地调试用
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

// 这个壳不引任何依赖：只有 Activity + WebView。
